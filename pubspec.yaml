name: home_medicine_box
description: Local-first family health record app scaffold for HomeMedicineBox.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.0.0
  flutter_local_notifications: ^19.0.0
  flutter_riverpod: ^2.6.1
  image_picker: ^1.0.0
  local_auth: ^2.0.0
  path_provider: ^2.0.0

dev_dependencies:
  build_runner: ^2.4.0
  drift_dev: ^2.0.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

